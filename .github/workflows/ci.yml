name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.8.6  # keep in step with requirements-dev.txt

      - name: Lint
        run: ruff check --output-format=github .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # confluent-kafka 2.15 ships wheels for cp38-cp314; 3.9 is the floor
        # this project documents and 3.13 the current stable release.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Protobuf support is optional, so its suite must skip here
        run: |
          output=$(pytest tests/test_protobuf.py -q -rs 2>&1) || true
          echo "$output"
          if ! echo "$output" | grep -qi "skipped"; then
            echo "Expected the protobuf suite to skip without the optional extras."
            echo "If it ran, something on the default path now pulls protobuf in."
            exit 1
          fi

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t kafka-latency-profiler:ci .

      - name: It runs as a non-root user
        run: |
          uid=$(docker run --rm kafka-latency-profiler:ci id -u)
          test "$uid" = "10001" || { echo "expected uid 10001, got $uid"; exit 1; }

      - name: No build toolchain is left in the image
        run: |
          if docker run --rm kafka-latency-profiler:ci sh -c 'command -v gcc' ; then
            echo "gcc should not be present: confluent-kafka ships manylinux wheels"
            exit 1
          fi

      - name: Credentials are not baked into the image
        run: |
          if docker run --rm kafka-latency-profiler:ci sh -c 'ls /app/arguments.env' 2>/dev/null ; then
            echo "arguments.env must not be copied into the image"
            exit 1
          fi

      - name: The application imports and reports missing configuration
        run: |
          docker run --rm kafka-latency-profiler:ci python -c 'import main'
          output=$(docker run --rm kafka-latency-profiler:ci python main.py 2>&1) && status=0 || status=$?
          echo "$output"
          test "$status" = "1" || { echo "expected exit 1 on missing config, got $status"; exit 1; }
          echo "$output" | grep -q "CONSUMER_CONFIG_FILE is required"

  test-protobuf:
    name: pytest (protobuf extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-protobuf.txt

      - name: Install dependencies, including the protobuf extra
        run: pip install -r requirements-dev.txt -r requirements-protobuf.txt

      - name: The protobuf suite must actually run here, not skip
        run: |
          output=$(pytest tests/test_protobuf.py -q -rs 2>&1) || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -qi "skipped"; then
            echo "The protobuf suite skipped even with the extras installed."
            exit 1
          fi

      - name: Full suite with the extra installed
        run: pytest
